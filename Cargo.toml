[workspace]
members = [
    "tpt-fl-exact-math",
    "tpt-fl-proof-ast",
    "tpt-fl-verify-macros",
    "tpt-fl-deterministic-sim",
    "tpt-fl-smt-bridge",
    "tpt-fl-redundancy",
    "tpt-fl-verified-ode",
    "tpt-fl-trace-macros",
    "tpt-fl-verified-algorithms",
    "tpt-fl-det-proptest",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-formal-lab"
authors = ["TPT Solutions"]

[workspace.dependencies]
# External
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
tpt-fl-verify-macros = { path = "tpt-fl-verify-macros", version = "0.1.0" }

# Workspace crates
tpt-fl-exact-math = { path = "tpt-fl-exact-math", version = "0.1.0" }
tpt-fl-proof-ast  = { path = "tpt-fl-proof-ast",  version = "0.1.0" }

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
